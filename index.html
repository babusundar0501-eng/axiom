<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXIOM — AI App Builder</title>
<style>
:root{--bg:#07090d;--p:#10141b;--p2:#151a23;--line:#252c38;--text:#eef2f7;--muted:#8e99aa;--a:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Arial;height:100vh;overflow:hidden}button,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--p2);color:var(--text);border-radius:9px;padding:9px 12px}button.primary{background:var(--a);border-color:var(--a)}header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px}.logo{font-size:21px;font-weight:800;letter-spacing:2px}.muted{color:var(--muted)}.spacer{flex:1}.layout{display:grid;grid-template-columns:230px 1fr 290px;height:calc(100vh - 58px)}aside,.right{background:var(--p);padding:14px;overflow:auto;border-right:1px solid var(--line)}.right{border:0;border-left:1px solid var(--line)}h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:8px 0 12px}.card{background:var(--p);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}.page{padding:9px;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between}.page.active{background:#1b2030}.main{display:flex;flex-direction:column;min-width:0}.toolbar,.prompt{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:8px}.prompt{display:block}.prompt textarea{width:100%;min-height:76px;background:#0e1219;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;resize:vertical}.workspace{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0}.blueprint,.preview{overflow:auto;padding:16px}.blueprint{border-right:1px solid var(--line)}.component{padding:8px;border:1px solid var(--line);border-radius:8px;margin:6px 0;display:flex;justify-content:space-between}.component button{padding:3px 8px}.preview-frame{background:white;color:#111;min-height:100%;border-radius:12px;padding:28px}.preview-frame h1{font-size:36px}.pbtn{display:inline-block;background:#111;color:#fff;padding:11px 16px;border-radius:8px;margin:5px}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#0a0d12;padding:10px;border-radius:8px}@media(max-width:900px){.layout{grid-template-columns:180px 1fr}.right{display:none}.workspace{grid-template-columns:1fr}.blueprint{display:none}}
</style></head>
<body>
<header><div class="logo">AXIOM</div><span class="muted">AI APP BUILDER</span><span class="spacer"></span><button onclick="save()">Save</button><button onclick="exportApp()">Export HTML</button></header>
<div class="layout">
<aside><h3>Project</h3><div class="card"><b id="name">Untitled App</b><div class="muted">Local project</div></div><h3>Pages</h3><div id="pages"></div><button onclick="addPage()">+ Add page</button><h3>Components</h3><button onclick="addComp('button')">+ Button</button> <button onclick="addComp('text')">+ Text</button> <button onclick="addComp('card')">+ Card</button></aside>
<main class="main"><div class="toolbar"><button class="primary" onclick="generate()">Generate App</button><button onclick="render()">Refresh</button><span class="muted" id="status">Ready</span></div><div class="prompt"><textarea id="prompt" placeholder="Describe the app you want to build..."></textarea></div><div class="workspace"><section class="blueprint"><h3>App Blueprint</h3><div id="bp"></div></section><section class="preview"><h3>Live Preview</h3><div id="preview" class="preview-frame"></div></section></div></main>
<section class="right"><h3>Inspector</h3><div class="card"><div class="stat"><span>Pages</span><b id="pc">0</b></div><div class="stat"><span>Components</span><b id="cc">0</b></div><div class="stat"><span>Runtime</span><b>Browser</b></div></div><h3>Blueprint JSON</h3><pre id="json"></pre></section>
</div>
<script>
const KEY="axiom-project";let app={name:"Untitled App",pages:[{name:"Home",components:[{type:"heading",text:"Welcome to AXIOM"},{type:"text",text:"Describe an app and AXIOM turns the idea into a structured blueprint."},{type:"button",text:"Get Started"}]}]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function update(){name.textContent=app.name;pc.textContent=app.pages.length;cc.textContent=app.pages.reduce((n,p)=>n+p.components.length,0);pages.innerHTML=app.pages.map((p,i)=>`<div class="page ${i?"":"active"}"><span>${esc(p.name)}</span><button onclick="delPage(${i})">×</button></div>`).join("");bp.innerHTML=app.pages.map((p,i)=>`<div class="card"><b>${esc(p.name)}</b>${p.components.map((c,j)=>`<div class="component"><span>${esc(c.type)}: ${esc(c.text||"")}</span><button onclick="delComp(${i},${j})">×</button></div>`).join("")}</div>`).join("");json.textContent=JSON.stringify(app,null,2);render()}
function generate(){let q=prompt.value.trim();if(!q)return;let l=q.toLowerCase();let n=q.replace(/^(make|build|create)\s+/i,"").split(/ with | that | for /i)[0].trim()||"AXIOM App";app.name=n.charAt(0).toUpperCase()+n.slice(1);let c=[{type:"heading",text:app.name},{type:"text",text:"Built with AXIOM."}];if(/task|todo|planner|checklist/.test(l))c.push({type:"card",text:"My Tasks"},{type:"button",text:"Add Task"});if(/study|school|learn|quiz/.test(l))c.push({type:"card",text:"Today's Learning"},{type:"button",text:"Start Lesson"});if(/shop|store|product/.test(l))c.push({type:"card",text:"Featured Products"},{type:"button",text:"Browse Products"});if(/dashboard|analytics|stats|progress/.test(l))c.push({type:"card",text:"Progress 72%"},{type:"card",text:"Activity"});if(c.length===2)c.push({type:"button",text:"Start Building"});app.pages=[{name:"Home",components:c}];if(/settings|profile/.test(l))app.pages.push({name:"Settings",components:[{type:"heading",text:"Settings"},{type:"button",text:"Save Changes"}]});if(/about/.test(l))app.pages.push({name:"About",components:[{type:"heading",text:"About"},{type:"text",text:"Built with AXIOM."}]});status.textContent="Blueprint generated";update()}
function addPage(){app.pages.push({name:"New Page",components:[{type:"heading",text:"New Page"}]});update()}function delPage(i){if(app.pages.length>1)app.pages.splice(i,1);update()}function addComp(type){app.pages[0].components.push({type,text:type==="button"?"New Button":type==="card"?"New Card":"New Text"});update()}function delComp(i,j){app.pages[i].components.splice(j,1);update()}
function render(){let p=app.pages[0];preview.innerHTML=p.components.map(c=>c.type==="heading"?`<h1>${esc(c.text)}</h1>`:c.type==="button"?`<span class="pbtn">${esc(c.text)}</span>`:c.type==="card"?`<div class="card"><b>${esc(c.text)}</b><div class="muted">AXIOM component</div></div>`:`<p>${esc(c.text)}</p>`).join("")}
function save(){localStorage.setItem(KEY,JSON.stringify(app));status.textContent="Saved locally"}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)app=x}catch(e){}update()}function exportApp(){let h="<!doctype html><html><head><meta charset=utf-8><title>"+esc(app.name)+"</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px}.pbtn{display:inline-block;background:#111;color:white;padding:12px 18px;border-radius:8px}.card{padding:18px;border:1px solid #ddd;border-radius:12px;margin:10px 0}</style></head><body>"+preview.innerHTML+"</body></html>";let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download="axiom-app.html";a.click()}load();
</script></body></html>
