<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXIOM Studio</title>
<style>
:root{--bg:#080a0f;--panel:#10141c;--panel2:#151b25;--line:#293140;--text:#f3f5f8;--muted:#8d98aa;--accent:#7c5cff;--canvas:#fff;--canvasText:#111}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,Arial;height:100vh;overflow:hidden}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer}button:hover{border-color:#596579}button.primary{background:var(--accent);border-color:var(--accent)}input,textarea,select{background:#0d1118;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
header{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px;background:#0a0d12}.logo{font-size:20px;font-weight:900;letter-spacing:2px}.spacer{flex:1}.muted{color:var(--muted)}.layout{height:calc(100vh - 56px);display:grid;grid-template-columns:220px 1fr 280px}
aside,.inspector{background:var(--panel);overflow:auto;padding:13px}.inspector{border-left:1px solid var(--line)}aside{border-right:1px solid var(--line)}h3{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:9px 0}
.section{border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:13px}.page{padding:9px;border-radius:8px;margin:3px 0;display:flex;justify-content:space-between;align-items:center}.page.active{background:#1d2432}.main{min-width:0;display:flex;flex-direction:column}.toolbar{display:flex;gap:7px;align-items:center;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tabs{display:flex;gap:5px;margin-left:auto}.tab.active{background:#242b39}.prompt{padding:10px;border-bottom:1px solid var(--line)}.prompt textarea{min-height:55px;resize:vertical}.workspace{display:grid;grid-template-columns:1fr 1fr;min-height:0;flex:1}.blueprint{overflow:auto;padding:14px;border-right:1px solid var(--line)}.preview{overflow:auto;padding:14px}.canvas{background:var(--canvas);color:var(--canvasText);min-height:100%;border-radius:12px;padding:30px;max-width:900px;margin:auto}.canvas.dark{background:#10131a;color:#f3f5f8}.canvas h1{font-size:40px;margin:0 0 10px}.canvas .hero{padding:25px;border-radius:14px;background:#f0f2f7;margin:12px 0}.canvas.dark .hero{background:#1b2230}.canvas .axiom-button{display:inline-block;padding:10px 15px;background:#111;color:white;border-radius:8px;margin:4px}.canvas .card{border:1px solid #d8dce3;border-radius:12px;padding:15px;margin:9px 0}.canvas.dark .card{border-color:#303847}.bp-card,.ins-card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px;margin-bottom:9px}.comp{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;margin:5px 0}.comp span{flex:1}.row{display:flex;gap:7px}.row>*{flex:1}.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}pre{white-space:pre-wrap;word-break:break-word;font-size:10px;background:#090c11;border:1px solid var(--line);padding:9px;border-radius:8px;max-height:270px;overflow:auto}.hidden{display:none}
@media(max-width:1000px){.layout{grid-template-columns:180px 1fr}.inspector{display:none}.workspace{grid-template-columns:1fr}.blueprint{display:none}}
</style></head>
<body>
<header><div class="logo">AXIOM</div><span class="muted">STUDIO</span><span class="spacer"></span><button onclick="undo()">Undo</button><button onclick="redo()">Redo</button><button onclick="save()">Save</button><button onclick="exportHTML()">Export</button></header>
<div class="layout">
<aside>
<div class="section"><h3>Project</h3><input id="projectName" value="Untitled App" oninput="app.name=this.value;sync(false)"></div>
<div class="section"><h3>Pages</h3><div id="pageList"></div><button onclick="addPage()">+ Page</button></div>
<div class="section"><h3>Add components</h3><div class="row"><button onclick="add('heading')">Heading</button><button onclick="add('text')">Text</button></div><div class="row"><button onclick="add('button')">Button</button><button onclick="add('card')">Card</button></div><button onclick="add('hero')" style="width:100%;margin-top:6px">Hero section</button></div>
<div class="section"><h3>Theme</h3><div class="row"><button onclick="theme('light')">Light</button><button onclick="theme('dark')">Dark</button></div></div>
</aside>
<main class="main">
<div class="toolbar"><button class="primary" onclick="generate()">Generate from prompt</button><button onclick="newProject()">New</button><button onclick="showJSON()">Blueprint</button><span class="muted" id="status">Ready</span><div class="tabs"><button class="tab active" onclick="setView('split',this)">Split</button><button class="tab" onclick="setView('preview',this)">Preview</button></div></div>
<div class="prompt"><textarea id="prompt" placeholder="Describe the app: “Build a study planner with a dashboard, tasks, progress and settings.”"></textarea></div>
<div class="workspace" id="workspace"><section class="blueprint"><h3>Blueprint editor</h3><div id="blueprint"></div></section><section class="preview"><h3>Live app</h3><div id="canvas" class="canvas"></div></section></div>
</main>
<section class="inspector"><h3>Inspector</h3><div class="ins-card"><div class="stat"><span>Pages</span><b id="pageCount">0</b></div><div class="stat"><span>Components</span><b id="componentCount">0</b></div><div class="stat"><span>Selected</span><b id="selectedLabel">None</b></div></div><h3>Selected component</h3><div id="editor" class="ins-card">Select a component in the blueprint.</div><h3>Blueprint JSON</h3><pre id="json"></pre></section>
</div>
<script>
const STORE="axiom-studio-v2";let history=[],future=[],selected=null;
let app={name:"Untitled App",theme:"light",pages:[{name:"Home",components:[{type:"heading",text:"Welcome to AXIOM"},{type:"text",text:"Describe your app and AXIOM builds its structured blueprint."},{type:"button",text:"Get Started"}]}]};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function snap(){history.push(JSON.stringify(app));if(history.length>40)history.shift();future=[]}
function undo(){if(!history.length)return;future.push(JSON.stringify(app));app=JSON.parse(history.pop());selected=null;sync()}
function redo(){if(!future.length)return;history.push(JSON.stringify(app));app=JSON.parse(future.pop());selected=null;sync()}
function sync(saveHistory=true){projectName.value=app.name;pageCount.textContent=app.pages.length;componentCount.textContent=app.pages.reduce((n,p)=>n+p.components.length,0);pageList.innerHTML=app.pages.map((p,i)=>`<div class="page ${i===0?"active":""}"><span>${esc(p.name)}</span><button onclick="removePage(${i})">×</button></div>`).join("");renderBlueprint();renderCanvas();json.textContent=JSON.stringify(app,null,2);if(saveHistory){}}
function renderBlueprint(){blueprint.innerHTML=app.pages.map((p,pi)=>`<div class="bp-card"><b>${esc(p.name)}</b>${p.components.map((c,ci)=>`<div class="comp" onclick="selectComp(${pi},${ci})"><span>${esc(c.type)} — ${esc(c.text)}</span><button onclick="event.stopPropagation();removeComp(${pi},${ci})">×</button></div>`).join("")}</div>`).join("")}
function renderCanvas(){let p=app.pages[0];canvas.className="canvas "+(app.theme==="dark"?"dark":"");canvas.innerHTML=p.components.map(c=>c.type==="heading"?`<h1>${esc(c.text)}</h1>`:c.type==="hero"?`<div class="hero"><h2>${esc(c.text)}</h2><p>Build something people can use.</p><span class="axiom-button">Start</span></div>`:c.type==="button"?`<span class="axiom-button">${esc(c.text)}</span>`:c.type==="card"?`<div class="card"><b>${esc(c.text)}</b><p>AXIOM component</p></div>`:`<p>${esc(c.text)}</p>`).join("")}
function selectComp(pi,ci){selected={pi,ci};let c=app.pages[pi].components[ci];selectedLabel.textContent=c.type;editor.innerHTML=`<label>Text</label><textarea id="selectedText" style="margin-top:6px">${esc(c.text)}</textarea><button class="primary" style="margin-top:7px;width:100%" onclick="applyEdit()">Apply</button>`}
function applyEdit(){snap();app.pages[selected.pi].components[selected.ci].text=selectedText.value;sync()}
function add(type){snap();let text={heading:"New Heading",text:"New text",button:"New Button",card:"New Card",hero:"New Hero"}[type];app.pages[0].components.push({type,text});sync()}
function removeComp(pi,ci){snap();app.pages[pi].components.splice(ci,1);selected=null;sync()}
function addPage(){snap();app.pages.push({name:"Page "+(app.pages.length+1),components:[{type:"heading",text:"New Page"}]});sync()}
function removePage(i){if(app.pages.length===1)return;snap();app.pages.splice(i,1);sync()}
function theme(t){snap();app.theme=t;sync()}
function generate(){let q=prompt.value.trim();if(!q)return;snap();let l=q.toLowerCase();let title=q.replace(/^(make|build|create)\s+/i,"").split(/ with | that | for /i)[0].trim()||"AXIOM App";let comps=[{type:"heading",text:title},{type:"text",text:"Generated by AXIOM."}];if(/dashboard|analytics|stats|progress/.test(l))comps.push({type:"hero",text:"Your Dashboard"},{type:"card",text:"Progress"},{type:"card",text:"Recent Activity"});if(/task|todo|planner|checklist/.test(l))comps.push({type:"card",text:"My Tasks"},{type:"button",text:"Add Task"});if(/study|school|learn|quiz/.test(l))comps.push({type:"hero",text:"Today's Learning"},{type:"button",text:"Start Lesson"});if(/shop|store|product/.test(l))comps.push({type:"card",text:"Featured Products"},{type:"button",text:"Browse Products"});if(comps.length===2)comps.push({type:"button",text:"Start Building"});app.name=title[0].toUpperCase()+title.slice(1);app.pages=[{name:"Home",components:comps}];if(/settings|profile/.test(l))app.pages.push({name:"Settings",components:[{type:"heading",text:"Settings"},{type:"button",text:"Save Changes"}]});if(/about/.test(l))app.pages.push({name:"About",components:[{type:"heading",text:"About"},{type:"text",text:"Built with AXIOM."}]});status.textContent="Blueprint generated";sync()}
function save(){localStorage.setItem(STORE,JSON.stringify(app));status.textContent="Saved locally"}
function load(){try{let x=JSON.parse(localStorage.getItem(STORE));if(x)app=x}catch(e){}sync(false)}
function newProject(){snap();app={name:"Untitled App",theme:"light",pages:[{name:"Home",components:[{type:"heading",text:"New AXIOM App"}]}]};selected=null;sync()}
function showJSON(){alert(JSON.stringify(app,null,2))}
function setView(v,el){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));el.classList.add("active");workspace.style.gridTemplateColumns=v==="preview"?"1fr":"1fr 1fr";if(v==="preview")document.querySelector(".blueprint").style.display="none";else document.querySelector(".blueprint").style.display=""}
function exportHTML(){let body=canvas.innerHTML;let dark=app.theme==="dark";let html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(app.name)}</title><style>body{font:16px system-ui;max-width:900px;margin:0 auto;padding:30px;background:${dark?"#10131a":"#fff"};color:${dark?"#fff":"#111"}}h1{font-size:42px}.hero{padding:25px;border-radius:14px;background:${dark?"#1b2230":"#f0f2f7"}}.card{border:1px solid #ccc;border-radius:12px;padding:15px;margin:9px 0}.axiom-button{display:inline-block;background:#111;color:#fff;padding:10px 15px;border-radius:8px;margin:4px}</style></head><body>${body}</body></html>`;let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download=(app.name||"axiom-app").replace(/\s+/g,"-").toLowerCase()+".html";a.click()}
load();
</script></body></html>
